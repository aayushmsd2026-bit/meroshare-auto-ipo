name: Auto apply IPO

on:
  schedule:
    # Nepal time = UTC+5:45. MeroShare applications close at 5 PM NPT on the last day.
    - cron: "30 4 * * *"   # 10:15 AM NPT - main run (also sends password-expiry emails)
    - cron: "15 7 * * *"   # 1:00 PM NPT  - retry (already-applied issues are skipped)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test run (check everything but do not submit)"
        type: boolean
        default: true
      apply_on:
        description: "When to apply"
        type: choice
        options: [last_day, any_day]
        default: last_day

concurrency:
  group: auto-ipo
  cancel-in-progress: false

permissions:
  contents: write   # to save the encrypted results file the app reads

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Apply
        env:
          # Each family member has a numbered slot (1-12); each phone/computer using the app has one (1-6).
          MS_ACCOUNT_1: ${{ secrets.MS_ACCOUNT_1 }}
          MS_PASSWORD_1: ${{ secrets.MS_PASSWORD_1 }}
          MS_ACCOUNT_2: ${{ secrets.MS_ACCOUNT_2 }}
          MS_PASSWORD_2: ${{ secrets.MS_PASSWORD_2 }}
          MS_ACCOUNT_3: ${{ secrets.MS_ACCOUNT_3 }}
          MS_PASSWORD_3: ${{ secrets.MS_PASSWORD_3 }}
          MS_ACCOUNT_4: ${{ secrets.MS_ACCOUNT_4 }}
          MS_PASSWORD_4: ${{ secrets.MS_PASSWORD_4 }}
          MS_ACCOUNT_5: ${{ secrets.MS_ACCOUNT_5 }}
          MS_PASSWORD_5: ${{ secrets.MS_PASSWORD_5 }}
          MS_ACCOUNT_6: ${{ secrets.MS_ACCOUNT_6 }}
          MS_PASSWORD_6: ${{ secrets.MS_PASSWORD_6 }}
          MS_ACCOUNT_7: ${{ secrets.MS_ACCOUNT_7 }}
          MS_PASSWORD_7: ${{ secrets.MS_PASSWORD_7 }}
          MS_ACCOUNT_8: ${{ secrets.MS_ACCOUNT_8 }}
          MS_PASSWORD_8: ${{ secrets.MS_PASSWORD_8 }}
          MS_ACCOUNT_9: ${{ secrets.MS_ACCOUNT_9 }}
          MS_PASSWORD_9: ${{ secrets.MS_PASSWORD_9 }}
          MS_ACCOUNT_10: ${{ secrets.MS_ACCOUNT_10 }}
          MS_PASSWORD_10: ${{ secrets.MS_PASSWORD_10 }}
          MS_ACCOUNT_11: ${{ secrets.MS_ACCOUNT_11 }}
          MS_PASSWORD_11: ${{ secrets.MS_PASSWORD_11 }}
          MS_ACCOUNT_12: ${{ secrets.MS_ACCOUNT_12 }}
          MS_PASSWORD_12: ${{ secrets.MS_PASSWORD_12 }}
          DEVICE_1: ${{ secrets.DEVICE_1 }}
          DEVICE_2: ${{ secrets.DEVICE_2 }}
          DEVICE_3: ${{ secrets.DEVICE_3 }}
          DEVICE_4: ${{ secrets.DEVICE_4 }}
          DEVICE_5: ${{ secrets.DEVICE_5 }}
          DEVICE_6: ${{ secrets.DEVICE_6 }}
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PAGE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
          APPLY_ON: ${{ github.event_name == 'workflow_dispatch' && inputs.apply_on || 'last_day' }}
        run: python apply_ipo.py
      - name: Save results for the app
        if: always()
        run: |
          [ -f docs/status.json ] || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/status.json
          git diff --cached --quiet && exit 0
          git commit -q -m "Update app results [skip ci]"
          for i in 1 2 3 4; do git pull -q --rebase origin main && git push -q origin HEAD:main && exit 0; sleep $((i * 3)); done
          exit 1
